name: Laravel CI and production deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: Validate and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Prepare Laravel environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Validate PHP syntax
        run: |
          find app bootstrap config database routes tests \
            -name '*.php' \
            -print0 | xargs -0 -n1 php -l

      - name: Run tests on isolated in-memory SQLite database
        run: php artisan test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      - name: Upload Vite build
        uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: public/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://moshaver-moradi.ir

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Vite build
        uses: actions/download-artifact@v4
        with:
          name: vite-build
          path: public/build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          set -euo pipefail

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/*' \
            --exclude='bootstrap/cache/*' \
            --exclude='public/storage' \
            -czf /tmp/moshaver-deploy.tar.gz .

      - name: Upload deployment package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail

          scp \
            -P "$DEPLOY_PORT" \
            -o BatchMode=yes \
            /tmp/moshaver-deploy.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/moshaver-deploy.tar.gz"

      - name: Deploy application
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          ssh \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          maintenance_enabled=false
          cleanup() {
            status=$?
            if [ "$maintenance_enabled" = true ]; then
              php artisan up
            fi
            return "$status"
          }

          trap cleanup EXIT

          echo "========================================"
          echo "Putting application into maintenance..."
          echo "========================================"

          php artisan down
          maintenance_enabled=true

          echo "========================================"
          echo "Extracting new application files..."
          echo "========================================"

          tar -xzf /tmp/moshaver-deploy.tar.gz -C "$DEPLOY_PATH"
          rm -f /tmp/moshaver-deploy.tar.gz

          echo "========================================"
          echo "Installing production dependencies..."
          echo "========================================"

          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --optimize-autoloader

          echo "========================================"
          echo "Clearing old Laravel caches..."
          echo "========================================"

          php artisan optimize:clear

          echo "========================================"
          echo "Creating storage link..."
          echo "========================================"

          if [ ! -e public/storage ]; then
            php artisan storage:link
          fi

          echo "========================================"
          echo "Running database migrations..."
          echo "========================================"

          php artisan migrate --force --no-interaction

          echo "========================================"
          echo "Running production-safe reference seeders..."
          echo "========================================"

          php artisan db:seed --class='Database\Seeders\ProductionSeeder' --force --no-interaction

          echo "========================================"
          echo "Rebuilding Laravel caches..."
          echo "========================================"

          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "========================================"
          echo "Restarting queue workers..."
          echo "========================================"

          php artisan queue:restart

          echo "========================================"
          echo "Bringing website online..."
          echo "========================================"

          php artisan up
          maintenance_enabled=false
          trap - EXIT

          echo "========================================"
          echo "Deployment completed successfully."
          echo "========================================"
          REMOTE
